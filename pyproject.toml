[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-tracker"
version = "0.1.0"
description = "Personal portfolio tracker that pulls holdings + transactions from Plaid and benchmarks against SPY/QQQ."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "plaid-python>=25",
    "snaptrade-python-sdk>=11",
    # snaptrade-python-sdk pins typing_extensions==4.13.2; Pydantic 2.10+
    # imports `Sentinel` which only exists in 4.14+. Force the newer one.
    "typing-extensions>=4.14.1",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "basedpyright>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "RET", "SIM", "RUF"]
ignore = [
    "E501",   # line length — handled by formatter
    "RUF002", # ambiguous unicode in docstrings
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["N999"]
"tests/**" = ["B", "N802"]

[tool.pyright]
include = ["src"]
exclude = ["frontend", "alembic/versions"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.basedpyright]
include = ["src"]
exclude = ["frontend", "alembic/versions"]
pythonVersion = "3.11"
typeCheckingMode = "all"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportAny = false

[tool.pytest.ini_options]
# Put `src/` on the path so `pytest` works from a fresh clone without an
# editable install, and only collect from `tests/`.
pythonpath = ["src"]
testpaths = ["tests"]
