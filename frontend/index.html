<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Tracker</title>
    <!-- Apply the saved theme before first paint so dark-mode users don't
         see a light flash. The toggle (see App.tsx) writes `pt-theme`. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pt-theme");
          if (t === "dark" || t === "light")
            document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <!-- Editorial type system: Inter (UI sans), Source Serif 4 (prose /
         quote accents), JetBrains Mono (tickers, figures, eyebrows).
         Mirrors the Earnings Summary workspace renderer's font stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
